<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="12" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="beam" x1="64" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9f06b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f9f06b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="64" y1="0" x2="116" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9f06b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f9f06b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="46" y1="0" x2="82" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="12" y="12" width="104" height="100" rx="24"/>
    </clipPath>
    <clipPath id="towershape">
      <path d="M55 54h18l7 50H48z"/>
    </clipPath>
  </defs>
  <!-- tile with its bottom edge -->
  <rect x="12" y="16" width="104" height="100" rx="24" fill="#0b3b75"/>
  <rect x="12" y="12" width="104" height="100" rx="24" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <!-- stars -->
    <circle cx="30" cy="30" r="1.6" fill="#fff" opacity=".7"/>
    <circle cx="96" cy="26" r="1.4" fill="#fff" opacity=".6"/>
    <circle cx="100" cy="74" r="1.2" fill="#fff" opacity=".5"/>
    <circle cx="26" cy="70" r="1.2" fill="#fff" opacity=".5"/>
    <!-- light beams -->
    <path d="M64 41L0 20v38z" fill="url(#beam)"/>
    <path d="M64 41l64-21v38z" fill="url(#beam2)"/>
    <!-- sea -->
    <path d="M0 98c10 0 14-4 22-4s12 4 22 4 14-4 22-4 12 4 22 4 14-4 22-4 12 4 18 4v30H0z" fill="#1c4d8c"/>
    <path d="M0 106c10 0 14-4 22-4s12 4 22 4 14-4 22-4 12 4 22 4 14-4 22-4 12 4 18 4v30H0z" fill="#153e72"/>
  </g>
  <!-- rock -->
  <path d="M40 104c0-5 6-8 12-8h24c6 0 12 3 12 8z" fill="#3d3846"/>
  <!-- tower with stripes -->
  <path d="M55 54h18l7 50H48z" fill="url(#tower)"/>
  <g clip-path="url(#towershape)" fill="#e01b24">
    <rect x="40" y="62" width="48" height="9"/>
    <rect x="40" y="80" width="48" height="9"/>
    <rect x="40" y="98" width="48" height="6"/>
  </g>
  <rect x="57" y="92" width="6" height="12" rx="3" fill="#3d3846"/>
  <!-- gallery -->
  <rect x="50" y="49" width="28" height="6" rx="2" fill="#3d3846"/>
  <!-- lantern -->
  <circle cx="64" cy="41" r="13" fill="#f9f06b" opacity=".35"/>
  <rect x="56" y="34" width="16" height="15" rx="2" fill="#f6d32d"/>
  <rect x="60" y="34" width="8" height="15" fill="#fff8b5"/>
  <!-- roof -->
  <path d="M53 35l11-11 11 11z" fill="#c01c28"/>
  <circle cx="64" cy="22.5" r="2.5" fill="#c01c28"/>
</svg>

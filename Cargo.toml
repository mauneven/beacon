[package]
name = "beacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Gentle reminders for GNOME"
license = "GPL-3.0-or-later"
repository = "https://github.com/mauneven/beacon"
readme = "README.md"
keywords = ["gnome", "reminders", "gtk4", "libadwaita", "health"]
categories = ["gui"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
gio = "0.22"
glib = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[build-dependencies]
glib-build-tools = "0.22"

[lib]
name = "beacon"
path = "src/lib.rs"

[[bin]]
name = "beacon"
path = "src/gui/main.rs"

[[bin]]
name = "beacon-daemon"
path = "src/daemon/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
